<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<rect x="40" y="70" width="320" height="120" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="200" y="108" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">HTML</text>
<text x="200" y="150" text-anchor="middle" font-size="15" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">&lt;input id="myInput" /&gt;</text>
<text x="200" y="176" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">id 属性</text>
<rect x="540" y="70" width="320" height="120" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="700" y="108" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">JavaScript</text>
<text x="700" y="150" text-anchor="middle" font-size="15" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">getElementById('myInput')</text>
<text x="700" y="176" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">引数</text>
<rect x="395" y="98" width="110" height="64" rx="16" fill="#fef9c3" stroke="#f59e0b" stroke-width="3.5"/>
<text x="450" y="138" text-anchor="middle" font-size="17" fill="#475569" font-weight="600" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">myInput</text>
<path d="M366.00 130.00 L389.00 130.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<path d="M511.00 130.00 L534.00 130.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<text x="450" y="255" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">同じ文字列であることだけが、2つを対応づけている（違えば null が返る）</text>
</svg>
