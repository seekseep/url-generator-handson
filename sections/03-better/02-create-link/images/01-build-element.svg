<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="300" fill="#ffffff"/>
<rect x="40" y="100" width="200" height="80" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="140" y="146" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">createElement('a')</text>
<text x="140" y="212" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">a 要素を作る</text>
<rect x="270" y="100" width="200" height="80" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="370" y="146" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">setAttribute(...)</text>
<text x="370" y="212" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">href と target を付ける</text>
<path d="M246.00 140.00 L264.00 140.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<rect x="500" y="100" width="200" height="80" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3.5"/>
<text x="600" y="146" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">textContent = url</text>
<text x="600" y="212" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">表示する文字を入れる</text>
<path d="M476.00 140.00 L494.00 140.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<rect x="730" y="100" width="200" height="80" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3.5"/>
<text x="830" y="146" text-anchor="middle" font-size="13" fill="#475569" font-weight="400" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">append(link)</text>
<text x="830" y="212" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">画面に入れる</text>
<path d="M706.00 140.00 L724.00 140.00" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aR)"/>
<text x="480" y="55" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">作る → 属性を付ける → 文字を入れる → 画面に入れる</text>
<text x="480" y="262" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">append するまで、作った要素は画面に出ない</text>
</svg>
