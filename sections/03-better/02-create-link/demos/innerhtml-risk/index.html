<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>innerHTML と createElement の違い</title>
    <style>
      body {
        font-family: "Segoe UI", "Meiryo", sans-serif;
        line-height: 1.7;
        margin: 16px;
      }

      input {
        width: 22em;
      }

      h2 {
        font-size: 1em;
        margin: 1.2em 0 0.3em;
      }

      .out {
        background: #f3f3f3;
        padding: 8px 10px;
        min-height: 1.7em;
      }

      .note {
        color: #555;
        margin: 0.3em 0 0;
      }
    </style>
  </head>
  <body>
    <p>
      件名
      <input id="title" value="&lt;b&gt;至急&lt;/b&gt; 月次報告" />
    </p>

    <h2>innerHTML に文字列で渡した場合</h2>
    <div id="byInnerHtml" class="out"></div>
    <p class="note">入力した文字がタグとして解釈され、表示が変わってしまいます。</p>

    <h2>createElement で要素として作った場合</h2>
    <div id="byCreateElement" class="out"></div>
    <p class="note">入力した文字がそのまま文字として出ます。</p>

    <script>
      const titleInput = document.getElementById('title');
      const byInnerHtml = document.getElementById('byInnerHtml');
      const byCreateElement = document.getElementById('byCreateElement');

      function update() {
        // 文字列としてタグを組み立てる書き方。
        byInnerHtml.innerHTML = '件名は「' + titleInput.value + '」です';

        // 要素を作り、文字は textContent で入れる書き方。
        byCreateElement.textContent = '';
        byCreateElement.append('件名は「');
        const strong = document.createElement('span');
        strong.textContent = titleInput.value;
        byCreateElement.append(strong);
        byCreateElement.append('」です');
      }

      titleInput.addEventListener('input', update);
      update();
    </script>
  </body>
</html>
