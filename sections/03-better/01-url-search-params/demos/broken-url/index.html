<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>文字列結合とURLSearchParamsの違い</title>
    <style>
      body {
        font-family: "Segoe UI", "Meiryo", sans-serif;
        line-height: 1.7;
        margin: 16px;
      }

      input {
        width: 22em;
      }

      h2 {
        font-size: 1em;
        margin: 1.4em 0 0.3em;
      }

      a {
        word-break: break-all;
      }

      .note {
        margin: 0.3em 0 0;
        color: #555;
      }

      .ng {
        color: #b00020;
      }

      .ok {
        color: #1b6b2f;
      }
    </style>
  </head>
  <body>
    <p>
      件名
      <input id="title" value="A&amp;B社 向け/報告" />
    </p>

    <p class="note">
      下の2つは、同じ入力から作った URL です。<b>押して受け取り側を見比べてください。</b>
    </p>

    <h2>文字列結合で作ったURL</h2>
    <p><a id="joined" target="_blank"></a></p>
    <p class="note ng">
      押すと、件名が「A」だけになり、残りが別のパラメータとして増えています。
    </p>

    <h2>URLSearchParams で作ったURL</h2>
    <p><a id="encoded" target="_blank"></a></p>
    <p class="note ok">
      押すと、入力したとおりの値が1つのパラメータとして届いています。
    </p>

    <script>
      const titleInput = document.getElementById('title');
      const joined = document.getElementById('joined');
      const encoded = document.getElementById('encoded');

      function update() {
        // 文字列結合で組み立てる（値の中の記号をそのまま URL に入れてしまう）
        const joinedUrl = 'docs.html?title=' + titleInput.value;
        joined.setAttribute('href', joinedUrl);
        joined.textContent = joinedUrl;

        // URLSearchParams で組み立てる（記号は自動で変換される）
        const params = new URLSearchParams();
        params.append('title', titleInput.value);
        const encodedUrl = 'docs.html?' + params.toString();
        encoded.setAttribute('href', encodedUrl);
        encoded.textContent = encodedUrl;
      }

      titleInput.addEventListener('input', update);
      update();
    </script>
  </body>
</html>
